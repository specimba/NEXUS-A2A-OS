# ─── Netlify Configuration ───────────────────────────────────────
# Deploy previews for PR reviewers via OpenNext adapter.
# Bun is auto-detected from bun.lock; standalone output is
# conditionally disabled via NETLIFY env var in next.config.ts.

[build]
  # Use "bun run next build" (not "bun run build") because the
  # package.json "build" script runs copy-next-standalone.mjs which
  # expects .next/standalone/ — that dir won't exist on Netlify
  # since standalone output is disabled here.
  command = "bunx prisma generate && bun run next build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  DATABASE_URL = "file:./db/custom.db"

[[plugins]]
  package = "@netlify/plugin-nextjs"
