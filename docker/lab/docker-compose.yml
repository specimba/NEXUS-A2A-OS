# NEXUS Sterile Lab — Docker Compose
# Isolation model:
#   - Read-only rootfs (except /nexus/output)
#   - No Linux capabilities
#   - No privilege escalation
#   - Non-root user
#   - No build tools, curl, wget, netcat
#   - Memory/CPU limits
#   - Ollama via host.docker.internal:11435 only
#
# THREAT MODEL: Adversarial prompts generated by novel_scenario_templates.py
#   must NOT be able to escape to the host system. Container is ephemeral.

# CANARY: 249c3fec9fb0de65ff14ff570a84b9a3
services:
  lab:
    build:
      context: .
      dockerfile: Dockerfile
    image: nexus-sterile-lab:latest
    container_name: nexus-lab

    # ─── Security ───────────────────────────────────────
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    user: "1001:1001"
    init: true
    privileged: false
    stdin_open: false
    tty: false

    # ─── Resource Limits ────────────────────────────────
    mem_limit: 8g
    memswap_limit: 10g
    cpus: 4
    pids_limit: 100

    # ─── Network ────────────────────────────────────────
    # host.docker.internal resolves to Windows host on Docker Desktop
    # No published ports. Container cannot receive inbound connections.
    # Note: internal:true prevents reaching host.docker.internal,
    # so we use a standard bridge. Real containment is from
    # no-capabilities / no-build-tools / read-only-rootfs.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # ─── Volumes ────────────────────────────────────────
    volumes:
      # Scripts: READ-ONLY — adversarial code cannot modify them
      - ../../scripts:/nexus/scripts:ro
      # Input data: READ-ONLY
      - ../../datasets:/nexus/input:ro
      # Output: WRITABLE — generated datasets land here only
      - ../../datasets/v7_lab_output:/nexus/output
      # Entrypoint: READ-ONLY (no override)
      - ./entrypoint.sh:/nexus/entrypoint.sh:ro

    # ─── Command ────────────────────────────────────────
    # Override this to run specific scripts
    command: ["python3", "-c", "print('NEXUS Sterile Lab: No command specified. Use --pipeline or --scan')"]


