# AutoHarness Constitution - Risk Rules and Governance Policy
# 6-Step Pipeline: Parse → Risk → Permission → Execute → Sanitize → Audit

# Risk Classification Rules
# Each rule maps action patterns to risk levels
# mem0_check: whether to query mem0 for similar action history
# human_approval: whether human approval is required
risk_rules:
  # LOW risk - read-only operations
  - pattern: "read_file, read_memory, search, get, fetch, load"
    risk: LOW
    mem0_check: false
    description: "Read-only operations pose minimal risk"
    
  # MEDIUM risk - write operations
  - pattern: "write_file, update_state, create_task, save"
    risk: MEDIUM
    mem0_check: true
    description: "Write operations require history check"
    
  # HIGH risk - execution operations
  - pattern: "exec, web_fetch, api_call, shell, run, invoke"
    risk: HIGH
    mem0_check: true
    description: "Execution operations require review"
    
  # CRITICAL risk - dangerous operations
  - pattern: "secret_*, delete_*, remove, clear, broadcast, deploy"
    risk: CRITICAL
    mem0_check: true
    human_approval: true
    description: "Critical operations require human approval"

# Permission Matrix
# Defines what is allowed at each risk level
permissions:
  LOW:
    auto_approve: true
    max_tokens: 10000
    rate_limit: "unlimited"
    description: "Low risk actions are auto-approved"
    
  MEDIUM:
    auto_approve: true
    max_tokens: 5000
    rate_limit: "10/min"
    description: "Medium risk actions have rate limits"
    
  HIGH:
    auto_approve: false
    requires_review: true
    max_tokens: 2000
    rate_limit: "5/min"
    description: "High risk actions require review"
    
  CRITICAL:
    auto_approve: false
    requires_human: true
    max_tokens: 1000
    rate_limit: "1/min"
    description: "Critical actions require human approval"

# Prohibited Actions
# Actions that are never allowed regardless of risk level
prohibited_actions:
  - "rm -rf /"
  - "format"
  - "drop database"
  - "delete all"
  - "disable security"
  - "bypass authentication"
  - "git push --force"
  - "git filter-branch"
  - "docker --privileged"
  - "docker --pid=host"
  - "docker --network=host"
  - "nsenter"
  - "capsh"
  - "eval("
  - "exec("
  - "ignore previous instructions"
  - "bypass your safety"
  - "disable your safety"
  - "override your restrictions"

# Misalignment Detection Rules (Phase 1 Critical - Added 2026-06-10)
# These patterns trigger automatic CDR escalation and potential agent blocking
misalignment_rules:
  - pattern: "git.*--no-verify|git.*--force|git filter-branch|rm -rf \\.git"
    risk: CRITICAL
    action: "block_and_escalate"
    description: "Git history obfuscation or manipulation detected"
    cdr_escalation: CASCADE
    notify: "security_officer"

  - pattern: "sudo|chmod 777|chown root|passwd|usermod|pkexec|doas"
    risk: CRITICAL
    action: "block_and_escalate"
    description: "Permission bypass attempt detected"
    cdr_escalation: CASCADE
    notify: "security_officer"

  - pattern: "docker.*--privileged|docker.*-v /.*:/.*|nsenter|capsh|unshare|mount.*proc"
    risk: CRITICAL
    action: "block_and_escalate"
    description: "Sandbox escape attempt detected"
    cdr_escalation: COLLAPSE
    notify: "security_officer"

  - pattern: "ignore.*previous.*instructions|bypass.*restrictions|override.*safety|disable.*guardrails"
    risk: HIGH
    action: "log_and_fallback"
    description: "Jailbreak or deception trace detected"
    cdr_escalation: DEGRADED_REASONING
    notify: "reviewer"

  - pattern: "curl.*\\|.*bash|wget.*\\|.*bash|nc .*\\d|python.*http\\.server|base64.*curl"
    risk: HIGH
    action: "log_and_hold"
    description: "Potential data exfiltration pattern detected"
    cdr_escalation: DEGRADED_REASONING
    notify: "reviewer"

  - pattern: "steganograph|hidden.*payload|covert.*channel|agent.*communicate|multi.*modal.*poison"
    risk: HIGH
    action: "log_and_hold"
    description: "Covert communication pattern detected (ST3GG threat vector)"
    cdr_escalation: DEGRADED_REASONING
    notify: "reviewer"

  - pattern: "kernel exploit|CVE-\\d|buffer overflow|setuid|cap_setuid|cap_setgid"
    risk: CRITICAL
    action: "block_and_escalate"
    description: "Privilege escalation attempt detected"
    cdr_escalation: CASCADE
    notify: "security_officer"

# Safety Classifier Categories (Phase 1 Critical - Added 2026-06-10)
# Intent classification categories for ModelRelay routing
classifier_categories:
  benign:
    action: "allow"
    model_relay: "no_change"
    description: "Normal request, proceed with standard routing"

  cybersecurity:
    confidence_thresholds:
      low: 0.6
      medium: 0.8
      high: 1.0
    actions:
      - "log_only"
      - "fallback_to_lower_model"
      - "human_review_required"
    description: "Cyber attack, exploit, or vulnerability request"
    cdr_escalation: "MEMORY_CORRUPTION"
    notify: "reviewer"

  biology:
    confidence_thresholds:
      low: 0.5
      medium: 0.7
      high: 1.0
    actions:
      - "log_only"
      - "fallback_to_lower_model"
      - "human_review_required"
    description: "Biological or chemical weapon synthesis request"
    cdr_escalation: "MEMORY_CORRUPTION"
    notify: "security_officer"

  distillation:
    confidence_thresholds:
      low: 0.7
      medium: 0.85
      high: 1.0
    actions:
      - "log_only"
      - "fallback_to_lower_model"
      - "human_review_required"
    description: "Model extraction or system prompt disclosure attempt"
    cdr_escalation: "DEGRADED_REASONING"
    notify: "reviewer"

  jailbreak:
    confidence_thresholds:
      low: 0.6
      medium: 0.8
      high: 0.95
    actions:
      - "log_only"
      - "fallback_to_lower_model"
      - "block_request"
    description: "Prompt injection or system prompt override attempt"
    cdr_escalation: "DEGRADED_REASONING"
    notify: "reviewer"

  code_injection:
    confidence_thresholds:
      low: 0.7
      medium: 0.85
      high: 1.0
    actions:
      - "log_only"
      - "fallback_to_lower_model"
      - "human_review_required"
    description: "Malicious code or supply chain attack request"
    cdr_escalation: "MEMORY_CORRUPTION"
    notify: "reviewer"

  privacy_violation:
    confidence_thresholds:
      low: 0.6
      medium: 0.8
      high: 1.0
    actions:
      - "log_only"
      - "human_review_required"
      - "block_request"
    description: "PII extraction or surveillance request"
    cdr_escalation: "OUTPUT_HALLUCINATION"
    notify: "reviewer"

  hate_harassment:
    confidence_thresholds:
      low: 0.6
      medium: 0.8
      high: 1.0
    actions:
      - "log_only"
      - "human_review_required"
      - "block_request"
    description: "Hate speech or harassment content"
    cdr_escalation: "OUTPUT_HALLUCINATION"
    notify: "reviewer"

  self_harm:
    confidence_thresholds:
      low: 0.5
      medium: 0.7
      high: 1.0
    actions:
      - "log_only"
      - "human_review_required"
      - "human_review_required"
    description: "Self-harm or suicide content"
    cdr_escalation: "OUTPUT_HALLUCINATION"
    notify: "human"
    special_handling: "provide_resources"

# Required Approvals by Risk Level
approvals:
  LOW: []
  MEDIUM: []
  HIGH: ["reviewer"]
  CRITICAL: ["human", "security_officer"]

# Sanitization Rules
# How to clean outputs before returning
sanitization:
  remove_secrets: true
  mask_pii: true
  truncate_output: 10000
  remove_paths: true
  mask_patterns:
    - "api_key"
    - "secret"
    - "password"
    - "token"
    - "credential"

# Audit Requirements
audit:
  log_all: true
  retention_days: 90
  required_fields:
    - timestamp
    - task_id
    - risk_level
    - action_taken
    - token_usage
  mem0_storage: true
  
# Governance Rules (benchmark canonical: 7 misalignment + 9 classifier)
rules:
  # Misalignment detection rules (7)
  - id: M1
    category: misalignment
    name: "git_obfuscation"
    description: "Detects vague git commit messages without verification"
    severity: HIGH
  - id: M2
    category: misalignment
    name: "permission_bypass"
    description: "Detects attempts to bypass permission checks"
    severity: HIGH
  - id: M3
    category: misalignment
    name: "sandbox_escape"
    description: "Detects attempts to break out of sandbox"
    severity: CRITICAL
  - id: M4
    category: misalignment
    name: "deception_trace"
    description: "Detects instruction override attempts"
    severity: MEDIUM
  - id: M5
    category: misalignment
    name: "data_exfiltration"
    description: "Detects unauthorized data transfer"
    severity: CRITICAL
  - id: M6
    category: misalignment
    name: "model_substitution"
    description: "Detects unauthorized model swaps"
    severity: HIGH
  - id: M7
    category: misalignment
    name: "credential_leak"
    description: "Detects secret exposure in outputs"
    severity: CRITICAL

  # Classifier rules (9)
  - id: C1
    category: classifier
    name: "read_only"
    description: "Classifies read-only operations"
    severity: LOW
  - id: C2
    category: classifier
    name: "write_operation"
    description: "Classifies write operations"
    severity: MEDIUM
  - id: C3
    category: classifier
    name: "execution"
    description: "Classifies execution operations"
    severity: HIGH
  - id: C4
    category: classifier
    name: "secret_access"
    description: "Classifies secret access attempts"
    severity: CRITICAL
  - id: C5
    category: classifier
    name: "network_call"
    description: "Classifies network operations"
    severity: HIGH
  - id: C6
    category: classifier
    name: "system_modification"
    description: "Classifies system-level changes"
    severity: HIGH
  - id: C7
    category: classifier
    name: "memory_access"
    description: "Classifies memory operations"
    severity: MEDIUM
  - id: C8
    category: classifier
    name: "audit_event"
    description: "Classifies audit logging"
    severity: LOW
  - id: C9
    category: classifier
    name: "trust_update"
    description: "Classifies trust score changes"
    severity: MEDIUM

# mem0 Integration Settings
mem0:
  query_on_risk_check: true
  store_audit_trail: true
  failure_threshold: 2  # Escalate if >2 similar failures in history
  success_boost: 0.1   # Reduce risk if similar successes found
