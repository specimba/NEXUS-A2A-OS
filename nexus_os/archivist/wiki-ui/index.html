<style>
  :root {
    --bg-primary: #0a0a0f;
    --bg-secondary: #12121a;

    --text-primary: #e0e0e0;
    --text-secondary: #9090a0;

    --sidebar-width: 280px;
    --radius: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-sans);
    background: var(--bg-primary);
    color: var(--text-primary);
    height: 100vh;
    overflow: hidden;
    display: flex;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg-primary); }
  ::-webkit-scrollbar-thumb { background: var(--bg-tertiary); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--border-color); }

  /* Sidebar */
  .sidebar {
    width: var(--sidebar-width);
    background: var(--bg-secondary);
    border-right: 1px solid var(--border-color);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }

  .sidebar-header {
    padding: 20px 16px;
    border-bottom: 1px solid var(--border-color);
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 18px;
    font-weight: 700;
    color: var(--accent-cyan);
    letter-spacing: 0.5px;
  }

  .logo-icon {
    width: 32px; height: 32px;
    background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
    border-radius: var(--radius);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: bold; color: var(--bg-primary);
  }

  .search-box {
    padding: 12px 16px;
  }

  .search-box input {
    width: 100%;
    padding: 10px 14px;
    background: var(--bg-tertiary);
    border: 1px solid var(--border-color);
    border-radius: var(--radius);
    color: var(--text-primary);
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }

  .search-box input:focus {
    border-color: var(--accent-cyan);
  }

  .search-box input::placeholder {
    color: var(--text-muted);
  }

  .tree-view {
    flex: 1;
    overflow-y: auto;
    padding: 8px 12px;
  }

  .tree-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    transition: background 0.15s;
    user-select: none;
  }

  .tree-item:hover {
    background: var(--bg-hover);
  }

  .tree-item.active {
    background: var(--bg-hover);
    color: var(--accent-cyan);
  }

  .tree-item .icon {
    width: 16px; height: 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
  }

  .tree-folder .icon { color: var(--accent-orange); }
  .tree-file .icon { color: var(--text-muted); }
  .tree-file.active .icon { color: var(--accent-cyan); }

  .tree-children {
    margin-left: 20px;
    border-left: 1px solid var(--border-color);
    padding-left: 4px;
  }

  .tree-item.collapsed + .tree-children {
    display: none;
  }

  .sidebar-footer {
    padding: 12px 16px;
    border-top: 1px solid var(--border-color);
    font-size: 11px;
    color: var(--text-muted);
  }

  /* Main Content */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .tabs-bar {
    display: flex;
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border-color);
    padding: 0 4px;
    overflow-x: auto;
    flex-shrink: 0;
  }

    display: flex;
    align-items: center;
    gap: 6px;
    padding: 10px 16px;
    font-size: 13px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
    white-space: nowrap;
  }

  .tab:hover { background: var(--bg-hover); }
  .tab.active {
    border-bottom-color: var(--accent-cyan);
    color: var(--accent-cyan);
  }

  .tab .close-btn {
    width: 16px; height: 16px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 4px;
    font-size: 12px;
    opacity: 0.6;

  .tab .close-btn:hover {
    background: var(--accent-red);
    color: white;
    opacity: 1;
  }

  .content-area {
    flex: 1;
    overflow-y: auto;
    padding: 24px 32px;

    font-size: 32px;

    margin-bottom: 14px;
    color: var(--text-secondary);
  }

  .markdown-body a {
    color: var(--accent-cyan);
    text-decoration: none;
  }

  .markdown-body a:hover {
    text-decoration: underline;
  }

  .markdown-body code {
    font-family: var(--font-mono);
    background: var(--bg-tertiary);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 0.9em;
    color: var(--accent-orange);
  }

  .markdown-body pre {
    background: var(--bg-tertiary);

    border-radius: var(--radius);
    padding: 16px;
    overflow-x: auto;
    margin-bottom: 16px;

  .markdown-body pre code {
    background: none;
    padding: 0;
    color: var(--text-primary);
  }

  .markdown-body blockquote {
    border-left: 3px solid var(--accent-cyan);
    padding-left: 16px;
    margin-left: 0;
    color: var(--text-muted);
  }

    margin-bottom: 14px;
    padding-left: 24px;

  .markdown-body li {
    margin-bottom: 4px;
    color: var(--text-secondary);
  }

    width: 100%;
    border-collapse: collapse;
    margin-bottom: 16px;

  .markdown-body th {
    background: var(--bg-tertiary);

    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border-color);

    padding: 6px 12px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid var(--border-color);
    background: var(--bg-tertiary);
    color: var(--text-secondary);
    transition: all 0.15s;

  .action-btn:hover {
    background: var(--bg-hover);
    color: var(--text-primary);
    border-color: var(--accent-cyan);

  .status-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 16px;
    background: var(--bg-secondary);
    border-top: 1px solid var(--border-color);
    font-size: 11px;
    color: var(--text-muted);
    flex-shrink: 0;

    align-items: center;
    gap: 12px;
  }

  .status-indicator {

  }

  .status-indicator.warning { background: var(--accent-orange); }
  .status-indicator.error { background: var(--accent-red); }

</head>

// ============================
// RENDER FUNCTIONS
// ============================
let activeTab = "index";
let openTabs = ["index"];

function renderTree() {
  const container = document.getElementById("treeView");
  container.innerHTML = "";

  function renderNode(node, depth = 0) {
    const div = document.createElement("div");
    if (node.type === "folder") {
      div.className = "tree-item tree-folder";
      div.innerHTML = `<span class="icon">${node.icon}</span><span>${node.name}</span>`;
      div.onclick = () => {
        div.classList.toggle("collapsed");
        const children = div.nextElementSibling;
        if (children) children.style.display = children.style.display === "none" ? "block" : "none";
      };
      container.appendChild(div);

      const childrenDiv = document.createElement("div");
      childrenDiv.className = "tree-children";
      childrenDiv.style.display = depth === 0 ? "block" : "none";
      node.children.forEach(child => {
        const childDiv = document.createElement("div");
        childDiv.className = "tree-item tree-file" + (child.name === activeTab ? " active" : "");
        childDiv.innerHTML = `<span class="icon">${child.icon}</span><span>${child.label}</span>`;
        childDiv.onclick = () => openPage(child.name);
        childrenDiv.appendChild(childDiv);
      });
      container.appendChild(childrenDiv);
    }
  }

  treeStructure.forEach(node => renderNode(node));
}

function renderMarkdown(markdown) {
  // Simple markdown parser
  let html = markdown
    .replace(/^# (.*$)/gim, '<h1>$1</h1>')
    .replace(/^## (.*$)/gim, '<h2>$1</h2>')
    .replace(/^### (.*$)/gim, '<h3>$1</h3>')
    .replace(/^\*\*(.*)\*\*/gim, '<strong>$1</strong>')
    .replace(/\*\*(.*)\*\*/gim, '<strong>$1</strong>')
    .replace(/\`([^`]+)\`/gim, '<code>$1</code>')
    .replace(/^\> (.*$)/gim, '<blockquote>$1</blockquote>')
    .replace(/^\- (.*$)/gim, '<li>$1</li>')
    .replace(/^\d+\. (.*$)/gim, '<li>$1</li>')
    .replace(/\n\n/gim, '</p><p>')
    .replace(/\n/gim, '<br>');

  // Tables (simple)
  html = html.replace(/\|(.+)\|/g, (match, p1) => {
    const cells = p1.split('|').map(c => c.trim()).filter(c => c);
    if (cells.length === 0) return match;
    return '<tr>' + cells.map(c => `<td>${c}</td>`).join('') + '</tr>';
  });

  // Wrap tables
  if (html.includes('<tr>')) {
    html = html.replace(/(<tr>.*<\/tr>)/s, '<table>$1</table>');
  }

  // Wrap lists
  html = html.replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>');

  return html;
}

function openPage(pageId) {
  if (!wikiData[pageId]) return;

  activeTab = pageId;
  if (!openTabs.includes(pageId)) {
    openTabs.push(pageId);
  }

  renderTabs();
  renderContent();
  renderTree();
}

function renderTabs() {
  const container = document.getElementById("tabsBar");
  container.innerHTML = "";

  openTabs.forEach(tabId => {
    const data = wikiData[tabId];
    if (!data) return;

    const tab = document.createElement("div");
    tab.className = "tab" + (tabId === activeTab ? " active" : "");
    tab.innerHTML = `<span>${data.title}</span>`;
    if (openTabs.length > 1) {
      tab.innerHTML += `<span class="close-btn" onclick="event.stopPropagation(); closeTab('${tabId}')">×</span>`;
    }
    tab.onclick = () => openPage(tabId);
    container.appendChild(tab);
  });
}

function closeTab(tabId) {
  openTabs = openTabs.filter(t => t !== tabId);
  if (activeTab === tabId && openTabs.length > 0) {
    activeTab = openTabs[openTabs.length - 1];
  }
  renderTabs();
  renderContent();
  renderTree();
}

function renderContent() {
  const data = wikiData[activeTab];
  if (!data) return;

  document.getElementById("markdownBody").innerHTML = renderMarkdown(data.content);
  document.getElementById("graphView").classList.remove("active");
}

// ============================
// ACTIONS
// ============================
function toggleGraph() {
  const graph = document.getElementById("graphView");
  const body = document.getElementById("markdownBody");
  if (graph.classList.contains("active")) {
    graph.classList.remove("active");
    body.style.display = "block";
  } else {
    graph.classList.add("active");
    body.style.display = "none";
  }
}

// ============================
// SEARCH
// ============================
document.getElementById("searchInput").addEventListener("input", (e) => {
  const query = e.target.value.toLowerCase();
  if (!query) {
    renderTree();
    return;
  }

  // Simple search: highlight matching tree items
  const items = document.querySelectorAll(".tree-item");
  items.forEach(item => {
    const text = item.textContent.toLowerCase();
    item.style.display = text.includes(query) ? "flex" : "none";
  });
});

// ============================
// KEYBOARD SHORTCUTS
// ============================
document.addEventListener("keydown", (e) => {
  if (e.ctrlKey && e.key === "k") {
    e.preventDefault();
    document.getElementById("searchInput").focus();
  }
  if (e.key === "Escape") {
    document.getElementById("searchInput").blur();
  }
});

// ============================
// STATUS BAR
// ============================
function updateStatus() {
  const now = new Date();
  document.getElementById("timeDisplay").textContent = now.toLocaleTimeString();
}

// ============================
// INIT
// ============================
renderTree();
renderTabs();
renderContent();
setInterval(updateStatus, 1000);
updateStatus();
</script>
