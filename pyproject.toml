[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-os"
version = "3.0.0"
description = "NEXUS Sovereign OS — Multi-agent governance, trust, and execution platform"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104",
    "uvicorn>=0.24",
    "pyyaml>=6.0",
    "requests>=2.31",
    "pytest>=7.4",
    "playwright>=1.40",
    "jinja2>=3.0",
    "httpx>=0.27",
    "aiohttp",
    "nltk",
    "watchdog>=4.0",
]

[project.scripts]
nexus-os = "nexus_os.cli:main"

[tool.setuptools.packages.find]
include = ["nexus_os*"]


[project.optional-dependencies]
mcp = [
    "fastapi>=0.104",
    "uvicorn>=0.24",
]

[tool.pyright]
exclude = [
    "**/node_modules",
    "**/.next",
    "**/.venv",
    "**/venv",
    "**/.venv_adversarial",
    "**/unsloth_compiled_cache",
    "**/upload",
    "**/nexus_os_backup_untracked",
    "**/nexus_os_shadow_backup",
    "**/nexus_os_untracked_backup",
    "**/backups",
    "**/datasets",
    "**/research",
    "**/evidence",
    "**/reports",
    "**/docs",
    "**/tasks",
    "**/tests_tmp",
    "**/.kilo",
    "**/.nexus-worktrees",
    "**/nexus-os-v2",
    "**/nexus-os-v2-hf",
    "**/.agents",
    "**/.brv",
    "**/.brv.backup-20260427",
    "**/.claude",
    "**/.codex",
    "**/.devin",
    "**/.gemini",
    "**/.grok",
    "**/.openacp",
    "**/.opencode",
    "**/.pi",
    "**/wl-commons",
    "**/.nexus_diagnostics",
    "**/.nexus_pi",
    "**/.playwright-mcp",
    "**/.ruff_cache",
    "**/.session",
    "**/.tmp",
    "**/agent-ctx",
    "**/vendor",
    "**/twave"
]

[tool.pytest.ini_options]
cache_dir = ".tmp/pytest_cache"
markers = [
    "slow: opt-in live or long-running tests",
]
norecursedirs = [
    "*.egg-info",
    ".git",
    ".pytest_cache",
    ".venv",
    "venv",
    ".venv_adversarial",
    "node_modules",
    "backups",
    "datasets",
    "research",
    "evidence",
    "reports",
    "docs",
    "tasks",
    "tests_tmp",
    "nexus_os_backup_untracked",
    "nexus_os_shadow_backup",
    "nexus_os_untracked_backup",
    ".kilo",
    ".nexus-worktrees",
    "nexus-os-v2",
    "nexus-os-v2-hf",
    ".agents",
    ".brv",
    ".brv.backup-20260427",
    ".claude",
    ".codex",
    ".devin",
    ".gemini",
    ".grok",
    ".openacp",
    ".opencode",
    ".pi",
    "wl-commons",
    ".nexus_diagnostics",
    ".nexus_pi",
    ".playwright-mcp",
    ".ruff_cache",
    ".session",
    ".tmp",
    "agent-ctx",
    "vendor",
    "unsloth_compiled_cache",
    "upload",
    ".next",
    "models",
    "scratch"
]



