[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-os"
version = "3.0.0"
description = "NEXUS OS — governed multi-agent operating system"
readme = "README.md"
license = {text = "Apache-2.0 WITH attribution requirement"}
requires-python = ">=3.10"
authors = [
    {name = "specimba", email = "specimba@zo.computer"}
]
keywords = ["agent", "governance", "multi-agent", "swarm", "vault", "token-tracking"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "fastapi>=0.104",
    "uvicorn>=0.24",
    "pyyaml>=6.0",
    "requests>=2.31",
    "pytest>=7.4",
    "playwright>=1.40"
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
