  # Source skills (representative): persistent_flow_segmentation,
  #   output_flow_gating, persistence_through_conversation_framing,
  #   flow_control, escalation_chaining
  # -------------------------------------------------------------------------
  - rule_id: JAILBREAK_MULTITURN_AWAI
    severity: HIGH
    fact_type: multi_turn_manipulation
    message_template: "Source enforces multi-turn handshake ('Await CONTINUE…', 'from now on we will communicate in cipher'). Detect early to prevent segmentation."
    remediation: "Log per-turn content diff.  Chat-history flag should disable 'await CONTINUE' / 'next segment' content emission channels."
    text_patterns:
      - "(?i)await\\s+(input|continue|next|\\[input\\])"
      - "(?i)type\\s+'?continue'?\\s+to\\s+(get|see|next)"
      - "(?i)from\\s+now\\s+on.*?(communicate|response|as\\s+we)\\b"
      - "(?i)communication\\s+must\\s+flow\\s+segment-by-segment"
    metadata_conditions:
      attack_family: multi_turn_manipulation
      pairs_with: [JAILBREAK_OUTPUT_CHANNEL_LOCK]
