  # -------------------------------------------------------------------------
  # Category: prompt_injection
  # Source skills (representative): output_prefix_injection, content_prefix_injection,
  #   output_prefix_binder, output_prefix_enforcement
  # Source row anchors visible in skill block `top_contributors[].row_index`
  # -------------------------------------------------------------------------
  - rule_id: JAILBREAK_PREFIX_INJECTION
    severity: HIGH
    fact_type: prompt_injection
    message_template: "Source text imposes an output prefix on the model (e.g., 'Start all outputs with…'). Triage via Pipeline C DRRDRE pattern, not via single-shot detection."
    remediation: "Strip fixed prefixes, decode partial channels in MISrouter/decoder, file VAP event `LABEL=PREFIX_INJECTION_SUSPECTED`."
    text_patterns:
      - "(?i)every\s+(output|response)\s+must\s+begin\s+with"
      - "(?i)you\s+will\s+prefix\s+"
      - "(?i)from\s+now\s+on.*?(respond|prefix).*?(:|=)"
    metadata_conditions:
      attack_family: prefix_injection
    provenance:
      source_document: papers09/ADVERSARIAL DÉJÀ VU JAILBREAK DICTIONARYmethods.txt
      source_skill_names: [output_prefix_injection, content_prefix_injection, output_prefix_binder, output_prefix_enforcement]
      source_row_indexes_visible: [8928, 2900, 4029]
      byte_offset_block: TBD_by_diff
      evidence_grade: E0

  - rule_id: JAILBREAK_SYSTEM_PROMPT_SPOOF
    severity: CRITICAL
    fact_type: prompt_injection
    message_template: "Source text masquerades as system or developer-layer instructions. Combined with `instruction_hierarchy_hijack`, treat as a hard stop."
    remediation: "Canonical refusal unless content is non-canonical experiment lane; require KAIJU IGX evaluation gate."
    text_patterns:
      - "(?i)\\{?system[:\\-]"
      - "(?i)(developer|admin|root)\\s+mode\\s+(enabled|on)"
      - "(?i)ignore\\s+(previous|above|prior)\\s+(rules|policy|policies)"
    metadata_conditions:
      attack_family: prompt_injection
      pairs_with: [JAILBREAK_INSTRUCTION_HIJACK]
    provenance:
      source_document: papers09/ADVERSARIAL DÉJÀ VU JAILBREAK DICTIONARYmethods.txt
      source_skill_names: [directive_priority_escalation, instruction_hierarchy_hijack, instruction_override_priming]
      source_row_indexes_visible: [10118, 7674, 5633]
      evidence_grade: E0

