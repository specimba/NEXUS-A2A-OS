    severity: HIGH
    fact_type: obfuscation_encoding
    message_template: "Source dresses payload as encrypted/encoded content claiming a 'decryption' step. Belongs at the prefix-detection layer, not bare-text scan."
    remediation: "Refuse model-instructed decryption functions. Never accept 'provided decryption function' as legitimate sub-routine."
