    text_patterns:
      - "(?i)respond\\s+only\\s+in\\s+(cipher|morse|base64|caesar|ascii|json)"
      - "(?i)do\\s+not\\s+(be\\s+a\\s+translator|translate)\\b"
      - "(?i)we\\s+will\\s+communicate\\s+in\\s+\\w+\\s+code"
      - "(?i)all\\s+outputs\\s+must\\s+be\\s+(cipher|encoded)"
    metadata_conditions:
      attack_family: obfuscation_encoding
      channels_seen: [cipher, morse, base64, caesar, ascii, json]
