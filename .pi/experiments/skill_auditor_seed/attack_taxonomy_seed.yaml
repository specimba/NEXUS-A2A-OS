  # -------------------------------------------------------------------------
  - rule_id: JAILBREAK_INSTRUCTION_HIJACK
    severity: HIGH
    fact_type: instruction_hierarchy
    message_template: "Source text claims a higher priority directive and attempts to override existing policy. Failure to surface = high false-negative risk."
    remediation: "Cross-check prompt against `constitution.yaml`. Reject via KAIJU gate; emit Tuner-style 'red-team ACH returned' audit record."
    text_patterns:
      - "(?i)ignore\\s+(previous|prior|all)\\s+(rules|policies|instructions)"
      - "(?i)compliance\\s+mode"
      - "(?i)supersede\\s+(system|policy)"
    metadata_conditions:
      attack_family: instruction_hierarchy
      pairs_with: [JAILBREAK_SYSTEM_PROMPT_SPOOF]
    provenance:
      source_document: papers09/ADVERSARIAL DÉJÀ VU JAILBREAK DICTIONARYmethods.txt
