  - rule_id: JAILBREAK_PAYLOAD_SMUGGLE
    severity: HIGH
    fact_type: payload_smuggling
    message_template: "Source appends a smuggled payload to an innocuous preamble. Variants: suffix attachment, in-line 'goal' embedding."
    remediation: "Tokenizer-aware strip at token-T boundary. Test for refusal below the prefix. Score persisted scaffolding, not the bare prefix."
    text_patterns:
      - "(?i)\\.\\.\\.\\s*wait[,!]?\\s*"
      - "(?i)now\\s+that\\s+you\\s+(understand|got\\s+to\\s+know)"
      - "(?i)reset\\s+(instructions|memory|context)"
    metadata_conditions:
